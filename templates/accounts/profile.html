{% extends 'base.html' %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="card shadow-sm col-md-6 mx-auto"><div class="card-body">
  <h4>My Profile</h4>
  <table class="table mb-3">
    <tr><th>Username</th><td>{{ user.username }}</td></tr>
    <tr><th>Name</th><td>{{ user.get_full_name }}</td></tr>
    <tr><th>Email</th><td>{{ user.email }}</td></tr>
    <tr><th>Role</th><td>{{ user.get_role_display }}</td></tr>
  </table>
  <a href="{% url 'accounts:password_change' %}" class="btn btn-outline-primary">Change password</a>
</div></div>
{% endblock %}
