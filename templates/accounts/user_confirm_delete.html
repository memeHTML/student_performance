{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm col-md-6 mx-auto"><div class="card-body">
  <h4>Delete user</h4>
  <p>Are you sure you want to delete <strong>{{ object.username }}</strong>? This cannot be undone.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'accounts:user_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div></div>
{% endblock %}
